<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Contact | Theresa Wenzel</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: linear-gradient(120deg, #293c4d, #344d60);
      color: #ffffff;
      font-family: Arial, sans-serif;
      line-height: 1.7;
    }

    /* OBERE NAVIGATIONSRLEISTE */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 70px;
      background: rgba(41, 60, 77, 0.95);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 5%;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 1000;
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #ffffff;
      text-decoration: none;
      font-weight: bold;
      font-size: 1.05rem;
      letter-spacing: 1px;
    }

    .nav-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #72b8ff;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #293c4d;
      font-weight: bold;
      overflow: hidden;
    }

    .nav-links {
      display: flex;
      list-style: none;
      gap: 25px;
      margin: 0;
      padding: 0;
    }

    .nav-links a {
      color: #c5cdd5;
      text-decoration: none;
      font-size: 0.95rem;
      transition: color 0.2s ease;
    }

    .nav-links a:hover,
    .nav-links a.active {
      color: #83c5ff;
    }

    .nav-links a.active {
      border-bottom: 2px solid #83c5ff;
      padding-bottom: 4px;
    }

    /* MITTIGER KONTAKTBEREICH */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding-top: 70px;
      padding-bottom: 60px;
    }

    .contact-container {
      width: min(600px, 90%);
      padding: 40px 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .contact-title {
      font-size: 2.2rem;
      font-weight: 700;
      margin: 0 0 20px 0;
      color: #ffffff;
    }

    .contact-email {
      display: inline-block;
      color: #6bb3ff;
      font-size: 1.3rem;
      text-decoration: none;
      margin-bottom: 30px;
      transition: color 0.2s ease;
    }

    .contact-email:hover {
      color: #9cd1ff;
      text-decoration: underline;
    }

    /* ICONS */
    .social-links {
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    .social-icon {
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .social-icon:hover {
      opacity: 0.8;
      transform: translateY(-2px);
    }

    .social-icon svg {
      width: 32px;
      height: 32px;
      fill: currentColor;
    }

    footer {
      padding: 24px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      color: #c5cdd5;
      font-size: 0.85rem;
      text-align: center;
    }
  </style>
</head>

<body>

  <footer>
    © 2026 Theresa Wenzel

</body>
</html>
